name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job here only reads the repository. The repository default
# is write, so that the auto-merge workflow can merge; pinning it here keeps this
# workflow at what it actually needs.
permissions:
  contents: read

jobs:
  build:
    name: Build course code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and test every course project
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          projects=(courses/**/*.csproj)
          if [ ${#projects[@]} -eq 0 ]; then
            echo "No course projects yet."
            exit 0
          fi
          for proj in "${projects[@]}"; do
            if [[ "$proj" == *.Tests.csproj ]]; then
              echo "::group::Testing $proj"
              dotnet test "$proj" --configuration Release
            else
              echo "::group::Building $proj"
              dotnet build "$proj" --configuration Release
            fi
            echo "::endgroup::"
          done

  link-check:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress .
          token: ${{ secrets.GITHUB_TOKEN }}
          jobSummary: true

  bilingual-sync:
    name: Check bilingual file pairs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check en/de sync
        run: bash scripts/check-bilingual-sync.sh
